<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anima — Step 1 Demo</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #0d1117; color: #c9d1d9;
    font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
.header {
    background: #161b22; border-bottom: 1px solid #30363d;
    padding: 10px 20px; font-size: 13px; display: flex; align-items: center; gap: 16px; flex-shrink: 0;
}
.header .brand { color: #f78166; font-weight: bold; font-size: 15px; }
.header .dot { color: #3fb950; }
.header .sep { color: #30363d; }
.header .right { margin-left: auto; color: #8b949e; font-size: 12px; }
.messages {
    flex: 1; overflow-y: auto; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 10px;
}
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: #0d1117; }
.messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
.msg { max-width: 88%; padding: 10px 16px; border-radius: 8px; font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; animation: slideUp 0.2s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; background: #1f6feb33; color: #c9d1d9; border: 1px solid #1f6feb55; }
.msg.assistant { align-self: flex-start; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; }
.msg.thinking { align-self: flex-start; background: #161b2266; color: #8b949e; border: 1px dashed #30363d55; font-style: italic; font-size: 13px; }
.msg.error { align-self: center; background: #3a1010; color: #f85149; border: 1px solid #8a2020; font-size: 13px; }
.msg.system { align-self: center; color: #484f58; font-size: 12px; padding: 4px 0; background: transparent; border: none; }
.msg.done { align-self: center; color: #3fb950; font-size: 11px; padding: 2px 0; background: transparent; border: none; }
.msg.streaming::after { content: " ▌"; color: #f78166; animation: blink 0.7s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.thinking-dots::after { content: ""; animation: dots 1.2s infinite; }
@keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} 100%{content:""} }
.input-area {
    background: #161b22; border-top: 1px solid #30363d;
    padding: 12px 20px; display: flex; gap: 10px; flex-shrink: 0;
}
.input-area input {
    flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
    font-family: inherit; font-size: 14px; padding: 10px 14px; border-radius: 6px; outline: none;
}
.input-area input:focus { border-color: #f78166; }
.input-area input::placeholder { color: #484f58; }
.input-area button {
    background: #238636; color: #fff; border: 1px solid #2ea043;
    font-family: inherit; font-size: 14px; padding: 10px 24px; border-radius: 6px; cursor: pointer;
}
.input-area button:hover { background: #2ea043; }
.input-area button:disabled { background: #21262d; border-color: #30363d; color: #484f58; cursor: not-allowed; }
.status {
    background: #161b22; border-top: 1px solid #21262d;
    padding: 6px 20px; font-size: 11px; color: #8b949e;
    display: flex; gap: 24px; flex-shrink: 0; align-items: center;
}
.status .st { color: #484f58; }
.status .val { color: #3fb950; font-weight: bold; }
</style>
</head>
<body>
<div class="header">
    <span class="brand">⬡ Anima</span>
    <span class="sep">|</span> <span>v0.1.0</span>
    <span class="sep">|</span> <span><span class="dot">●</span> deepseek-v4-flash</span>
    <span class="right">Step 1 — Streaming Chat</span>
</div>
<div class="messages" id="messages">
    <div class="msg system">╔══════════════════════════════════╗</div>
    <div class="msg system">║  Anima v0.1.0 — 流式对话演示   ║</div>
    <div class="msg system">║  输入消息，观察逐 token 输出   ║</div>
    <div class="msg system">╚══════════════════════════════════╝</div>
</div>
<div class="input-area">
    <input type="text" id="input" placeholder="> 输入消息，Enter 发送..." autofocus />
    <button id="sendBtn">↵ 发送</button>
</div>
<div class="status">
    <span><span class="st">prompt:</span> <span class="val" id="statPrompt">0</span></span>
    <span><span class="st">completion:</span> <span class="val" id="statCompletion">0</span></span>
    <span id="statStatus" style="color:#f78166;"></span>
</div>
<script>
const $ = id => document.getElementById(id);
const msgs = $('messages'), inp = $('input'), btn = $('sendBtn');
const statP = $('statPrompt'), statC = $('statCompletion'), statS = $('statStatus');
let streaming = false;

function addMsg(type, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + type;
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
}

function send() {
    const t = inp.value.trim();
    if (!t || streaming) return;
    inp.value = ''; inp.disabled = true; btn.disabled = true;
    streaming = true; statS.textContent = '● 思考中...';
    addMsg('user', t);

    const thinkDiv = addMsg('thinking', 'thinking...');
    const respDiv = addMsg('assistant', '');
    respDiv.classList.add('streaming');
    let responded = false;

    fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: t})
    }).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const reader = r.body.getReader(), dec = new TextDecoder();
        let buf = '', evType = '', evData = '';
        function proc() {
            reader.read().then(({done, value}) => {
                if (done) { finish(); return; }
                buf += dec.decode(value, {stream: true});
                const lines = buf.split('\n');
                buf = lines.pop() || '';
                for (const line of lines) {
                    if (line.startsWith('event: ')) evType = line.slice(7).trim();
                    else if (line.startsWith('data: ')) {
                        evData = line.slice(6).replace(/\\n/g, '\n');
                        if (evType === 'thinking') thinkDiv.textContent = '💭 ' + evData;
                        else if (evType === 'response') {
                            if (!responded) { responded = true; statS.textContent = '▸ 生成中...'; }
                            respDiv.textContent += evData;
                        } else if (evType === 'done') {
                            try { const u = JSON.parse(evData); statP.textContent = u.promptTokens; statC.textContent = u.completionTokens; } catch(e) {}
                        } else if (evType === 'error') {
                            try { addMsg('error', '✗ ' + JSON.parse(evData).message); } catch(_) { addMsg('error', '✗ 连接异常'); }
                        }
                        evType = ''; evData = '';
                    }
                }
                msgs.scrollTop = msgs.scrollHeight;
                proc();
            }).catch(err => { if (err.name !== 'AbortError') addMsg('error', '✗ ' + err.message); finish(); });
        }
        proc();
    }).catch(err => { addMsg('error', '✗ ' + err.message); finish(); });
}

function finish() {
    streaming = false; inp.disabled = false; btn.disabled = false; inp.focus();
    statS.textContent = '';
    document.querySelectorAll('.msg.streaming').forEach(el => el.classList.remove('streaming'));
}
inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
btn.addEventListener('click', send);
</script>
</body>
</html>
