<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anima — Step 2 Agent Demo</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font-family:'Cascadia Code','Consolas','Courier New',monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:10px 20px;font-size:13px;display:flex;align-items:center;gap:16px;flex-shrink:0}
.header .brand{color:#f78166;font-weight:bold;font-size:15px}
.header .dot{color:#3fb950}
.header .sep{color:#30363d}
.header .right{margin-left:auto;color:#8b949e;font-size:12px}
.messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-track{background:#0d1117}
.messages::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
.msg{max-width:88%;padding:10px 16px;border-radius:8px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word;animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;background:#1f6feb33;color:#c9d1d9;border:1px solid #1f6feb55}
.msg.assistant{align-self:flex-start;background:#161b22;color:#c9d1d9;border:1px solid #30363d}
.msg.thinking{align-self:flex-start;background:#161b2266;color:#8b949e;border:1px dashed #30363d55;font-style:italic;font-size:13px}
.msg.error{align-self:center;background:#3a1010;color:#f85149;border:1px solid #8a2020;font-size:13px}
.msg.system{align-self:center;color:#484f58;font-size:12px;padding:4px 0;background:transparent;border:none}
.msg.done{align-self:center;color:#3fb950;font-size:11px;padding:2px 0;background:transparent;border:none}
.msg.tool{align-self:flex-start;background:#1a2332;border:1px solid #3fb95044;border-left:3px solid #3fb950;padding:8px 14px}
.msg.tool .tname{color:#3fb950;font-weight:bold;font-size:12px;margin-bottom:4px}
.msg.tool .targs{color:#8b949e;font-size:11px;margin-bottom:4px;font-family:monospace}
.msg.tool .tresult{color:#c9d1d9;font-size:12px;max-height:120px;overflow-y:auto;white-space:pre-wrap}
.msg.streaming::after{content:" ▌";color:#f78166;animation:blink .7s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.input-area{background:#161b22;border-top:1px solid #30363d;padding:12px 20px;display:flex;gap:10px;flex-shrink:0}
.input-area input{flex:1;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;font-family:inherit;font-size:14px;padding:10px 14px;border-radius:6px;outline:none}
.input-area input:focus{border-color:#f78166}
.input-area input::placeholder{color:#484f58}
.input-area button{background:#238636;color:#fff;border:1px solid #2ea043;font-family:inherit;font-size:14px;padding:10px 24px;border-radius:6px;cursor:pointer}
.input-area button:hover{background:#2ea043}
.input-area button:disabled{background:#21262d;border-color:#30363d;color:#484f58;cursor:not-allowed}
.status{background:#161b22;border-top:1px solid #21262d;padding:6px 20px;font-size:11px;color:#8b949e;display:flex;gap:24px;flex-shrink:0;align-items:center}
.status .st{color:#484f58}
.status .val{color:#3fb950;font-weight:bold}
</style>
</head>
<body>
<div class="header">
    <span class="brand">⬡ Anima</span>
    <span class="sep">|</span> <span>v0.2.0</span>
    <span class="sep">|</span> <span><span class="dot">●</span> deepseek-v4-flash</span>
    <span class="right">Step 2 — Agent Loop + Tools</span>
</div>
<div class="messages" id="msgs">
    <div class="msg system">╔══════════════════════════════════╗</div>
    <div class="msg system">║  Anima v0.2.0 — Agent + 工具调用  ║</div>
    <div class="msg system">║  试试："读一下 pom.xml"          ║</div>
    <div class="msg system">╚══════════════════════════════════╝</div>
</div>
<div class="input-area">
    <input type="text" id="inp" placeholder="> 输入消息..." autofocus />
    <button id="btn">↵ 发送</button>
</div>
<div class="status">
    <span><span class="st">工具:</span> <span class="val" id="statTools">read_file, bash</span></span>
    <span><span class="st">步数:</span> <span class="val" id="statSteps">0</span></span>
    <span id="statStatus" style="color:#f78166;"></span>
</div>
<script>
const M=id=>document.getElementById(id);
const msgs=M('msgs'),inp=M('inp'),btn=M('btn'),statTools=M('statTools'),statSteps=M('statSteps'),statS=M('statStatus');
let streaming=false,step=0;

function add(type,txt){const d=document.createElement('div');d.className='msg '+type;d.textContent=txt;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}

function send(){
    const t=inp.value.trim();if(!t||streaming)return;
    inp.value='';inp.disabled=true;btn.disabled=true;streaming=true;step=0;statSteps.textContent='0';statS.textContent='● 思考中...';
    add('user',t);
    const thinkDiv=add('thinking','thinking...');
    const respDiv=add('assistant','');respDiv.classList.add('streaming');
    let responded=false;

    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);
        const reader=r.body.getReader(),dec=new TextDecoder();let buf='',ev='',dat='';
        function proc(){reader.read().then(({done,value})=>{if(done){finish();return}
            buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';
            for(const ln of lines){
                if(ln.startsWith('event: '))ev=ln.slice(7).trim();
                else if(ln.startsWith('data: ')){dat=ln.slice(6);
                    if(ev==='thinking'){thinkDiv.textContent='💭 '+dat.replace(/\\n/g,'\n')}
                    else if(ev==='response'){if(!responded){responded=true;statS.textContent='▸ 生成中...'}respDiv.textContent+=dat.replace(/\\n/g,'\n')}
                    else if(ev==='tool_start'){try{const o=JSON.parse(dat);step++;statSteps.textContent=step;
                        const td=add('tool','');td.innerHTML='<div class="tname">🔧 '+o.name+'</div><div class="targs">args: '+escapeHtml(o.args||'')+'</div><div class="tresult" id="tr_'+step+'">⏳ executing...</div>';
                        td.id='tool_'+step;}catch(e){}}
                    else if(ev==='tool_result'){try{const o=JSON.parse(dat);
                        const tr=M('tr_'+step);if(tr)tr.textContent=o.result||'(empty)';}catch(e){}}
                    else if(ev==='done'){statS.textContent='✓';statSteps.textContent=step}
                    else if(ev==='error'){try{add('error','✗ '+JSON.parse(dat).message)}catch(_){add('error','✗ 异常')}}
                    ev='';dat='';
                }
            }
            msgs.scrollTop=msgs.scrollHeight;proc();
        }).catch(err=>{if(err.name!=='AbortError')add('error','✗ '+err.message);finish()})}proc();
    }).catch(err=>{add('error','✗ '+err.message);finish()});
}
function finish(){streaming=false;inp.disabled=false;btn.disabled=false;inp.focus();statS.textContent='';document.querySelectorAll('.msg.streaming').forEach(e=>e.classList.remove('streaming'))}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});btn.addEventListener('click',send);
</script>
</body>
</html>
